            </g>
            <g transform="translate(24, 137)">
              <circle cx="4" cy="4" r="3" fill="#c084fc" />
              <text x="16" y="8" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Dynamic context pruning & relevance decay algorithms preventing context overflow</text>
            </g>
            <g transform="translate(24, 159)">
              <circle cx="4" cy="4" r="3" fill="#c084fc" />
              <text x="16" y="8" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Low-latency sub-millisecond memory retrieval for continuous agentic tasks</text>
            </g>

  <!-- Divider -->
  <line x1="24" y1="185" x2="876" y2="185" stroke="#1e293b" stroke-width="1" />

  <!-- Tech Tags -->
  
            <g transform="translate(24, 196)">
