  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad_memoire)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Left Accent Accent Line -->
  <rect x="2" y="2" width="6" height="236" rx="3" fill="url(#glow_memoire)" />

  <!-- Top Category and Badge -->
  <text x="24" y="32" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">
    🧠  AUTONOMOUS AI AGENTS & SEMANTIC PERSISTENCE
  </text>

  <!-- Badge Pill -->
  <g transform="translate(680, 15)">
    <rect x="0" y="0" width="200" height="24" rx="12" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
