    AI Memory Graph & Long-Term Context Retention Engine for Autonomous LLM Agents.
  </text>

  <!-- Bullet points -->
  
            <g transform="translate(24, 115)">
              <circle cx="4" cy="4" r="3" fill="#c084fc" />
