<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad_chronolens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="glow_chronolens" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad_chronolens)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Left Accent Accent Line -->
  <rect x="2" y="2" width="6" height="236" rx="3" fill="url(#glow_chronolens)" />

  <!-- Top Category and Badge -->
  <text x="24" y="32" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">
    ⚡  PREDICTIVE SRE & TELEMETRY CONTROL PLANE
  </text>

  <!-- Badge Pill -->
  <g transform="translate(680, 15)">
    <rect x="0" y="0" width="200" height="24" rx="12" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
    <text x="100" y="16" text-anchor="middle" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">
      🏆 SIGNOZ HACKATHON WINNER
    </text>
  </g>

  <!-- Title -->
  <text x="24" y="68" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">
    ChronoLens
  </text>

  <!-- Tagline -->
  <text x="24" y="92" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13.5" font-weight="500">
    Closed-loop predictive reliability engine built on SigNoz OpenTelemetry feeds.
  </text>

  <!-- Bullet points -->
  
            <g transform="translate(24, 115)">
              <circle cx="4" cy="4" r="3" fill="#f43f5e" />
              <text x="16" y="8" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Predicts SLO breaches & AI agent cost spirals from live SigNoz traces before impact</text>
            </g>
            <g transform="translate(24, 137)">
              <circle cx="4" cy="4" r="3" fill="#f43f5e" />
              <text x="16" y="8" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Automated reversible circuit-breaker actions and instant rollback triggers</text>
            </g>
            <g transform="translate(24, 159)">
              <circle cx="4" cy="4" r="3" fill="#f43f5e" />
              <text x="16" y="8" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Generates verifiable digital audit receipts of 'outages that never happened'</text>
            </g>

  <!-- Divider -->
  <line x1="24" y1="185" x2="876" y2="185" stroke="#1e293b" stroke-width="1" />

  <!-- Tech Tags -->
  
            <g transform="translate(24, 196)">
              <rect x="0" y="0" width="65.0" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
              <text x="32.5" y="16" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">Python</text>
            </g>
            <g transform="translate(97.0, 196)">
              <rect x="0" y="0" width="117.5" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
              <text x="58.75" y="16" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">OpenTelemetry</text>
            </g>
            <g transform="translate(222.5, 196)">
              <rect x="0" y="0" width="95.0" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
              <text x="47.5" y="16" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">SigNoz API</text>
            </g>
            <g transform="translate(325.5, 196)">
              <rect x="0" y="0" width="72.5" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
              <text x="36.25" y="16" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">FastAPI</text>
            </g>
            <g transform="translate(406.0, 196)">
              <rect x="0" y="0" width="57.5" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
              <text x="28.75" y="16" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">React</text>
            </g>
            <g transform="translate(471.5, 196)">
              <rect x="0" y="0" width="65.0" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
              <text x="32.5" y="16" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">Docker</text>
            </g>

  <!-- View Repository Link Button -->
  <g transform="translate(720, 194)">
